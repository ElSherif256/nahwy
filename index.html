<!-- MAIN JAVASCRIPT APP logic -->
    <script>
        /* ================= INITIAL MOCK DATA ================= */
        const DEFAULT_QUIZZES = [
            {
                id: "quiz-nahw-1",
                title: "اختبار النحو المتقدم: المرفوعات والمنصوبات",
                category: "النحو",
                description: "اختبار شامل لقياس مدى فهم الجملة الاسمية والفعلية والمفاعيل.",
                createdBy: "كاتو ومصطفى الجوهري",
                createdAt: "2026-10-15",
                questions: [
                    {
                        id: "q1",
                        questionText: "قال تعالى: ﴿وَكَلَّمَ اللَّهُ مُوسَىٰ تَكْلِيمًا﴾. ما إعراب كلمة (تَكْلِيمًا)؟",
                        aiHint: "لاحظ أن الكلمة مصدر منصوب جاء لتأكيد المعنى المأخوذ من الفعل (كَلَّمَ).",
                        explanation: "(تَكْلِيمًا): مفعول مطلق منصوب وعلامة نصبه الفتحة الظاهرة لتوكيد الفعل.",
                        options: [
                            { text: "مفعول به ثاني", isCorrect: false },
                            { text: "مفعول مطلق منصوب", isCorrect: true },
                            { text: "حال منصوبة", isCorrect: false },
                            { text: "تمييز منصوب", isCorrect: false }
                        ]
                    },
                    {
                        id: "q2",
                        questionText: "حضر الطلابُ إلا طالبًا. نوع أسلوب الاستثناء وحكم المستثنى هنا:",
                        aiHint: "الجملة مثبتة (غير منفية) والمستثنى منه (الطلاب) مذكور في الكلام.",
                        explanation: "الأسلوب تام مثبت، وبالتالي يجب نصب المستثنى (طالبًا).",
                        options: [
                            { text: "تام مثبت - واجب النصب", isCorrect: true },
                            { text: "تام منفي - جائز النصب أو البدلية", isCorrect: false },
                            { text: "ناقص منفي - يعرب حسب موقعه", isCorrect: false },
                            { text: "منقطع - مبني على الضم", isCorrect: false }
                        ]
                    },
                    {
                        id: "q3",
                        questionText: "إنّ المعلمين المخلصين مَأْجُورُونَ. عند وضع (عَسى) مكان (إنّ) تكون الجملة الصحيحة:",
                        aiHint: "(عسى) من أفعال الرجاء تعمل عمل (كان) وترفع المبتدأ، وخبرها يغلب أن يكون مقترناً بـ (أن) والفعل المضارع.",
                        explanation: "(عسى) ترفع الاسم (المعلمون) وخبرها يكون جملة فعلية مع أقترانه بأن (أن يوجَروا).",
                        options: [
                            { text: "عسى المعلمين المخلصين أن يُؤجَروا", isCorrect: false },
                            { text: "عسى المعلمون المخلصون أن يُؤجَروا", isCorrect: true },
                            { text: "عسى المعلمون المخلصين مأجورين", isCorrect: false },
                            { text: "عسى المعلمين المخلصون مأجورون", isCorrect: false }
                        ]
                    }
                ]
            }
        ];

        /* ================= APP STATE ================= */
        let quizzes = [];
        let studentResults = [];
        let currentStudent = { name: "زائر جديد", deviceId: "" };
        let activeQuiz = null;
        let currentQuestionIndex = 0;
        let userAnswersLog = [];
        let teacherSession = null;

        document.addEventListener('DOMContentLoaded', () => {
            const yrEl = document.getElementById('current-year');
            if (yrEl) yrEl.textContent = new Date().getFullYear();
            
            initStudentIdentity();
            loadAppData();
            checkUrlForSharedExam();
        });

        function initStudentIdentity() {
            let deviceId = localStorage.getItem('nahwi_device_id');
            if (!deviceId) {
                deviceId = 'DEV-' + Math.random().toString(36).substring(2, 9).toUpperCase();
                localStorage.setItem('nahwi_device_id', deviceId);
            }
            currentStudent.deviceId = deviceId;
            const devEl = document.getElementById('display-device-id');
            if (devEl) devEl.textContent = deviceId;

            const savedName = localStorage.getItem('nahwi_student_name');
            if (savedName) {
                currentStudent.name = savedName;
            } else {
                currentStudent.name = "طالب " + deviceId.substring(4, 8);
                localStorage.setItem('nahwi_student_name', currentStudent.name);
            }
            const nameEl = document.getElementById('display-student-name');
            if (nameEl) nameEl.textContent = currentStudent.name;
        }

        function promptChangeStudentName() {
            const newName = prompt("أدخل اسمك الكريم للاختبارات:", currentStudent.name);
            if (newName && newName.trim() !== "") {
                currentStudent.name = newName.trim();
                localStorage.setItem('nahwi_student_name', currentStudent.name);
                const nameEl = document.getElementById('display-student-name');
                if (nameEl) nameEl.textContent = currentStudent.name;
                showToast("تم تحديث اسم الطالب بنجاح", "success");
            }
        }

        function loadAppData() {
            const savedQuizzes = localStorage.getItem('nahwi_quizzes');
            if (savedQuizzes) {
                try {
                    quizzes = JSON.parse(savedQuizzes);
                } catch (e) {
                    quizzes = DEFAULT_QUIZZES;
                }
            } else {
                quizzes = DEFAULT_QUIZZES;
                localStorage.setItem('nahwi_quizzes', JSON.stringify(quizzes));
            }

            const savedResults = localStorage.getItem('nahwi_student_results');
            if (savedResults) {
                try {
                    studentResults = JSON.parse(savedResults);
                } catch (e) {
                    studentResults = [];
                }
            }
            renderPublicQuizzes();
        }

        function saveAppData() {
            localStorage.setItem('nahwi_quizzes', JSON.stringify(quizzes));
            localStorage.setItem('nahwi_student_results', JSON.stringify(studentResults));
        }

        // ================= URL SHARE EXAM LOGIC =================
        function checkUrlForSharedExam() {
            const urlParams = new URLSearchParams(window.location.search);
            const encodedExam = urlParams.get('examData');
            if (encodedExam) {
                try {
                    const jsonString = decodeURIComponent(atob(encodedExam));
                    const sharedQuiz = JSON.parse(jsonString);
                    
                    if (sharedQuiz && sharedQuiz.id) {
                        const exists = quizzes.some(q => q.id === sharedQuiz.id);
                        if (!exists) {
                            quizzes.unshift(sharedQuiz);
                            saveAppData();
                        }
                        setTimeout(() => {
                            startQuiz(sharedQuiz.id);
                        }, 300);
                    }
                } catch (err) {
                    console.error("خطأ في قراءة رابط الاختبار:", err);
                    showToast("عذراً، رابط الاختبار التالف أو غير صالح", "error");
                }
            }
        }

        function generateShareableLink(quizId) {
            const quiz = quizzes.find(q => q.id === quizId);
            if (!quiz) return "";
            try {
                const jsonString = JSON.stringify(quiz);
                const encodedData = btoa(encodeURIComponent(jsonString));
                const baseUrl = window.location.origin + window.location.pathname;
                return `${baseUrl}?examData=${encodedData}`;
            } catch (err) {
                console.error("فشل توليد الرابط:", err);
                return "";
            }
        }

        function navigateTo(pageId) {
            const pHome = document.getElementById('page-home');
            const pQuiz = document.getElementById('page-quiz');
            const pResult = document.getElementById('page-result');
            const pTeacher = document.getElementById('page-teacher');

            if (pHome) pHome.classList.add('hidden');
            if (pQuiz) pQuiz.classList.add('hidden');
            if (pResult) pResult.classList.add('hidden');
            if (pTeacher) pTeacher.classList.add('hidden');

            if (pageId === 'home' || pageId === 'student-portal') {
                if (pHome) pHome.classList.remove('hidden');
                renderPublicQuizzes();
            } else if (pageId === 'quiz') {
                if (pQuiz) pQuiz.classList.remove('hidden');
            } else if (pageId === 'result') {
                if (pResult) pResult.classList.remove('hidden');
            } else if (pageId === 'teacher') {
                if (pTeacher) pTeacher.classList.remove('hidden');
                renderTeacherDashboard();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderPublicQuizzes() {
            const grid = document.getElementById('public-quiz-grid');
            const badge = document.getElementById('quiz-count-badge');
            if (badge) badge.textContent = quizzes.length + " اختبارات";
            
            if (!grid) return;
            if (quizzes.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">لا توجد اختبارات متاحة حالياً.</div>`;
                return;
            }

            grid.innerHTML = quizzes.map(quiz => `
                <div class="bg-white rounded-2xl p-6 border border-slate-200 card-shadow flex flex-col justify-between hover:border-amber-400 transition group">
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="px-2.5 py-1 bg-amber-50 text-amber-800 text-xs font-bold rounded-md border border-amber-200">
                                ${quiz.category || 'نحو وصرف'}
                            </span>
                            <span class="text-xs text-slate-400"><i class="fa-regular fa-clock ml-1"></i> ${quiz.questions ? quiz.questions.length : 0} أسئلة</span>
                        </div>
                        <h4 class="text-lg font-bold text-brand-navy font-quran group-hover:text-amber-600 transition">${quiz.title}</h4>
                        <p class="text-xs text-slate-500 leading-relaxed">${quiz.description || 'اختبار تفاعلي لقياس المهارات...'}</p>
                    </div>
                    <div class="pt-6 border-t border-slate-100 flex items-center justify-between">
                        <span class="text-[11px] text-slate-400">إشراف: ${quiz.createdBy || 'الأساتذة'}</span>
                        <button onclick="startQuiz('${quiz.id}')" class="px-4 py-2 gold-gradient text-white rounded-xl text-xs font-bold shadow hover:opacity-90 transition">
                            بدء الاختبار <i class="fa-solid fa-arrow-left mr-1"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function startQuiz(quizId) {
            const quiz = quizzes.find(q => q.id === quizId);
            if (!quiz || !quiz.questions || quiz.questions.length === 0) {
                showToast("عذراً، هذا الاختبار غير موجود أو لا يحتوي على أسئلة!", "error");
                return;
            }
            activeQuiz = quiz;
            currentQuestionIndex = 0;
            userAnswersLog = [];
            
            const titleEl = document.getElementById('active-quiz-title');
            const descEl = document.getElementById('active-quiz-desc');
            if (titleEl) titleEl.textContent = quiz.title;
            if (descEl) descEl.textContent = quiz.description;
            
            navigateTo('quiz');
            loadQuestion();
        }

        function loadQuestion() {
            const q = activeQuiz.questions[currentQuestionIndex];
            const total = activeQuiz.questions.length;
            
            const progTxt = document.getElementById('quiz-progress-text');
            const progBar = document.getElementById('quiz-progress-bar');
            if (progTxt) progTxt.textContent = `${currentQuestionIndex + 1} / ${total}`;
            if (progBar) progBar.style.width = `${((currentQuestionIndex + 1) / total) * 100}%`;
            
            const catEl = document.getElementById('question-category');
            const txtEl = document.getElementById('question-text');
            if (catEl) catEl.textContent = activeQuiz.category;
            if (txtEl) txtEl.textContent = q.questionText;
            
            const hintBox = document.getElementById('ai-hint-box');
            const hintTxt = document.getElementById('ai-hint-content');
            if (hintBox) hintBox.classList.add('hidden');
            if (hintTxt) hintTxt.textContent = q.aiHint || "لا يوجد تلميح متاح لهذا السؤال.";

            const feedbackPanel = document.getElementById('feedback-panel');
            if (feedbackPanel) feedbackPanel.classList.add('hidden');

            const container = document.getElementById('options-container');
            if (container) {
                container.innerHTML = q.options.map((opt, idx) => `
                    <button onclick="selectOption(${idx})" id="opt-btn-${idx}" class="w-full text-right p-4 rounded-xl border border-slate-200 bg-slate-50 hover:bg-amber-50/50 hover:border-amber-300 transition text-sm font-semibold flex items-center justify-between">
                        <span><strong class="ml-2 text-slate-400">${['أ', 'ب', 'ج', 'د'][idx]}.</strong> ${opt.text}</span>
                        <span class="option-icon w-6 h-6 rounded-full border border-slate-300 flex items-center justify-center text-xs text-transparent">✓</span>
                    </button>
                `).join('');
            }
        }

        function toggleAIHint() {
            const hintBox = document.getElementById('ai-hint-box');
            if (hintBox) hintBox.classList.toggle('hidden');
        }

        function selectOption(selectedIndex) {
            const q = activeQuiz.questions[currentQuestionIndex];
            const optionsButtons = document.querySelectorAll('[id^="opt-btn-"]');
            
            optionsButtons.forEach(btn => btn.disabled = true);

            const chosenOption = q.options[selectedIndex];
            const isCorrect = chosenOption.isCorrect;

            userAnswersLog.push({
                questionText: q.questionText,
                chosenAnswer: chosenOption.text,
                correctAnswer: q.options.find(o => o.isCorrect).text,
                isCorrect: isCorrect,
                explanation: q.explanation
            });

            optionsButtons.forEach((btn, idx) => {
                if (q.options[idx].isCorrect) {
                    btn.classList.remove('bg-slate-50', 'border-slate-200');
                    btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-900');
                    const icon = btn.querySelector('.option-icon');
                    if (icon) {
                        icon.className = "option-icon w-6 h-6 rounded-full bg-emerald-500 text-white flex items-center justify-center text-xs";
                        icon.textContent = "✓";
                    }
                } else if (idx === selectedIndex && !isCorrect) {
                    btn.classList.remove('bg-slate-50', 'border-slate-200');
                    btn.classList.add('bg-red-50', 'border-red-500', 'text-red-900');
                    const icon = btn.querySelector('.option-icon');
                    if (icon) {
                        icon.className = "option-icon w-6 h-6 rounded-full bg-red-500 text-white flex items-center justify-center text-xs";
                        icon.textContent = "✕";
                    }
                }
            });

            const feedbackPanel = document.getElementById('feedback-panel');
            const feedbackStatus = document.getElementById('feedback-status');
            const feedbackExplanation = document.getElementById('feedback-explanation');
            
            if (feedbackPanel) feedbackPanel.classList.remove('hidden');
            if (isCorrect) {
                if (feedbackPanel) feedbackPanel.className = "p-4 rounded-xl border bg-emerald-50 border-emerald-300 space-y-2";
                if (feedbackStatus) {
                    feedbackStatus.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600 ml-2 text-lg"></i> إجابة صحيحة! أحسنت`;
                    feedbackStatus.className = "flex items-center font-bold text-sm text-emerald-800";
                }
            } else {
                if (feedbackPanel) feedbackPanel.className = "p-4 rounded-xl border bg-red-50 border-red-300 space-y-2";
                if (feedbackStatus) {
                    feedbackStatus.innerHTML = `<i class="fa-solid fa-circle-xmark text-red-600 ml-2 text-lg"></i> إجابة خاطئة!`;
                    feedbackStatus.className = "flex items-center font-bold text-sm text-red-800";
                }
            }
            if (feedbackExplanation) feedbackExplanation.textContent = q.explanation || "لا توجد تفاصيل إضافية.";
            
            const nextBtn = document.getElementById('next-question-btn');
            if (nextBtn) {
                if (currentQuestionIndex === activeQuiz.questions.length - 1) {
                    nextBtn.innerHTML = `عرض النتيجة النهائية <i class="fa-solid fa-flag-checkered mr-1"></i>`;
                } else {
                    nextBtn.innerHTML = `السؤال التالي <i class="fa-solid fa-arrow-left mr-1"></i>`;
                }
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < activeQuiz.questions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            const totalQuestions = activeQuiz.questions.length;
            const correctCount = userAnswersLog.filter(ans => ans.isCorrect).length;
            const percentage = Math.round((correctCount / totalQuestions) * 100);
            
            let gradeText = "ممتاز";
            if (percentage < 50) gradeText = "يحتاج تحسين";
            else if (percentage < 75) gradeText = "جيد جداً";
            else if (percentage < 90) gradeText = "جيد جداً مرتفع";

            const scoreEl = document.getElementById('result-score');
            const percEl = document.getElementById('result-percentage');
            const gradeEl = document.getElementById('result-grade');
            if (scoreEl) scoreEl.textContent = `${correctCount} / ${totalQuestions}`;
            if (percEl) percEl.textContent = `${percentage}%`;
            if (gradeEl) gradeEl.textContent = gradeText;

            const breakdownList = document.getElementById('results-breakdown-list');
            if (breakdownList) {
                breakdownList.innerHTML = userAnswersLog.map((log, idx) => `
                    <div class="p-3 rounded-lg border ${log.isCorrect ? 'bg-emerald-50/50 border-emerald-200' : 'bg-red-50/50 border-red-200'} text-xs space-y-1">
                        <div class="font-bold text-slate-800">س${idx+1}: ${log.questionText}</div>
                        <div class="flex flex-wrap gap-3 text-[11px]">
                            <span class="${log.isCorrect ? 'text-emerald-700' : 'text-red-700'} font-semibold">إجابتك: ${log.chosenAnswer}</span>
                            ${!log.isCorrect ? `<span class="text-emerald-700 font-semibold">الإجابة الصحيحة: ${log.correctAnswer}</span>` : ''}
                        </div>
                        <p class="text-slate-600 text-[11px] pt-1 border-t border-slate-200/60"><strong>الإعراب/الشرح:</strong> ${log.explanation}</p>
                    </div>
                `).join('');
            }

            const resultRecord = {
                id: 'res-' + Date.now(),
                studentName: currentStudent.name,
                deviceId: currentStudent.deviceId,
                quizTitle: activeQuiz.title,
                score: `${correctCount} / ${totalQuestions}`,
                percentage: percentage,
                date: new Date().toLocaleDateString('ar-EG'),
                timestamp: Date.now(),
                errorsCount: totalQuestions - correctCount,
                logs: userAnswersLog
            };

            studentResults.unshift(resultRecord);
            saveAppData();

            navigateTo('result');
        }

        function confirmExitQuiz() {
            if (confirm("هل أنت متأكد من الخروج؟ سيتم فقدان تقدمك الحالي في الاختبار.")) {
                navigateTo('student-portal');
            }
        }

        function showStudentHistoryModal() {
            const modal = document.getElementById('modal-student-history');
            const content = document.getElementById('student-history-content');
            
            const myRecords = studentResults.filter(r => r.deviceId === currentStudent.deviceId);

            if (content) {
                if (myRecords.length === 0) {
                    content.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">لا توجد محاولات مسجلة باسمك على هذا الجهاز حتى الآن.</div>`;
                } else {
                    content.innerHTML = myRecords.map(rec => `
                        <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-2 text-xs">
                            <div class="flex justify-between items-center font-bold text-brand-navy">
                                <span>${rec.quizTitle}</span>
                                <span class="text-amber-600">${rec.score} (${rec.percentage}%)</span>
                            </div>
                            <div class="text-[11px] text-slate-400 flex justify-between">
                                <span>التاريخ: ${rec.date}</span>
                                <span>عدد الأخطاء: ${rec.errorsCount}</span>
                            </div>
                        </div>
                    `).join('');
                }
            }
            if (modal) modal.classList.remove('hidden');
        }

        // ================= TEACHER / ADMIN DASHBOARD LOGIC =================
        function openTeacherAuthModal() {
            if (teacherSession) {
                navigateTo('teacher');
            } else {
                const modal = document.getElementById('modal-teacher-auth');
                if (modal) modal.classList.remove('hidden');
            }
        }

        function handleTeacherLogin(e) {
            e.preventDefault();
            const nameEl = document.getElementById('auth-teacher-name');
            const passEl = document.getElementById('auth-passcode');
            const name = nameEl ? nameEl.value.trim() : "";
            const passcode = passEl ? passEl.value.trim() : "";

            if (passcode === "000") {
                teacherSession = { name: name || "أستاذ المادة" };
                const adminNameEl = document.getElementById('admin-teacher-name');
                if (adminNameEl) adminNameEl.textContent = teacherSession.name;
                
                closeModal('modal-teacher-auth');
                navigateTo('teacher');
                showToast("مرحباً بك في لوحة تحكم المعلم", "success");
            } else {
                showToast("رمز المرور غير صحيح! (الرمز الافتراضي: 000)", "error");
            }
        }

        function logoutTeacher() {
            teacherSession = null;
            navigateTo('home');
            showToast("تم تسجيل خروج المعلم بنجاح", "info");
        }

        function switchTeacherTab(tabName) {
            const btnQuizzes = document.getElementById('tab-btn-quizzes');
            const btnStudents = document.getElementById('tab-btn-students');
            const tabQuizzes = document.getElementById('teacher-tab-quizzes');
            const tabStudents = document.getElementById('teacher-tab-students');

            if (tabName === 'quizzes') {
                if (btnQuizzes) btnQuizzes.className = "px-4 py-3 font-bold text-xs sm:text-sm border-b-2 border-amber-500 text-amber-600 flex items-center";
                if (btnStudents) btnStudents.className = "px-4 py-3 font-bold text-xs sm:text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center";
                if (tabQuizzes) tabQuizzes.classList.remove('hidden');
                if (tabStudents) tabStudents.classList.add('hidden');
            } else {
                if (btnStudents) btnStudents.className = "px-4 py-3 font-bold text-xs sm:text-sm border-b-2 border-amber-500 text-amber-600 flex items-center";
                if (btnQuizzes) btnQuizzes.className = "px-4 py-3 font-bold text-xs sm:text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center";
                if (tabStudents) tabStudents.classList.remove('hidden');
                if (tabQuizzes) tabQuizzes.classList.add('hidden');
                renderTeacherStudentTable();
            }
        }

        function renderTeacherDashboard() {
            const qCountEl = document.getElementById('teacher-quiz-count');
            const sCountEl = document.getElementById('teacher-student-count');
            if (qCountEl) qCountEl.textContent = quizzes.length;
            if (sCountEl) sCountEl.textContent = studentResults.length;

            const listContainer = document.getElementById('teacher-quizzes-list');
            if (!listContainer) return;

            if (quizzes.length === 0) {
                listContainer.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-xs">لا توجد اختبارات مسجلة. انقر على "إنشاء اختبار جديد".</div>`;
                return;
            }

            listContainer.innerHTML = quizzes.map(quiz => {
                const shareLink = generateShareableLink(quiz.id);
                return `
                    <div class="bg-white rounded-xl p-5 border border-slate-200 card-shadow space-y-3 flex flex-col justify-between">
                        <div class="space-y-1.5">
                            <div class="flex justify-between items-center">
                                <span class="px-2 py-0.5 bg-slate-100 text-slate-700 text-[10px] font-bold rounded">${quiz.category}</span>
                                <span class="text-[11px] text-slate-400">${quiz.questions ? quiz.questions.length : 0} أسئلة</span>
                            </div>
                            <h4 class="font-bold text-brand-navy text-sm font-quran">${quiz.title}</h4>
                            <p class="text-xs text-slate-500 truncate">${quiz.description || 'بلا وصف'}</p>
                        </div>
                        
                        <!-- Share Link Box -->
                        <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 space-y-1">
                            <span class="text-[10px] font-bold text-slate-600 block"><i class="fa-solid fa-link text-amber-600 ml-1"></i> رابط الطالب المباشر:</span>
                            <div class="flex items-center gap-1">
                                <input type="text" readonly value="${shareLink}" class="w-full bg-white border rounded px-2 py-1 text-[10px] text-slate-600 font-mono select-all">
                                <button onclick="copyToClipboard('${shareLink}')" class="px-2.5 py-1 bg-amber-600 hover:bg-amber-500 text-white rounded text-[10px] font-bold transition flex-shrink-0" title="نسخ الرابط">
                                    <i class="fa-regular fa-copy"></i>
                                </button>
                            </div>
                        </div>

                        <div class="pt-2 border-t flex justify-between items-center">
                            <button onclick="openQuizModal('${quiz.id}')" class="text-xs text-amber-600 hover:underline font-bold"><i class="fa-solid fa-pen-to-square ml-1"></i> تعديل</button>
                            <button onclick="deleteQuiz('${quiz.id}')" class="text-xs text-red-600 hover:underline font-bold"><i class="fa-solid fa-trash ml-1"></i> حذف</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderTeacherStudentTable() {
            const tbody = document.getElementById('student-results-tbody');
            if (!tbody) return;
            if (studentResults.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400">لا توجد محاولات مسجلة للطلاب حتى الآن.</td></tr>`;
                return;
            }

            tbody.innerHTML = studentResults.map(rec => `
                <tr class="hover:bg-slate-50">
                    <td class="p-3 font-bold text-slate-800">${rec.studentName}</td>
                    <td class="p-3 text-slate-600">${rec.quizTitle}</td>
                    <td class="p-3 font-bold text-amber-600">${rec.score} (${rec.percentage}%)</td>
                    <td class="p-3 font-mono text-slate-500 text-xs">${rec.deviceId}</td>
                    <td class="p-3 text-slate-500 text-xs">${rec.date}</td>
                    <td class="p-3 text-red-600 font-semibold">${rec.errorsCount} أخطاء</td>
                </tr>
            `).join('');
        }

        function clearAllStudentRecords() {
            if (confirm("هل أنت متأكد من مسح كافة سجلات وسجلات درجات الطلاب؟")) {
                studentResults = [];
                saveAppData();
                renderTeacherStudentTable();
                showToast("تم مسح السجلات بنجاح", "info");
            }
        }

        function openQuizModal(quizId = null) {
            const modal = document.getElementById('modal-quiz-editor');
            const container = document.getElementById('editor-questions-container');
            if (!container) return;
            container.innerHTML = "";

            if (quizId) {
                const quiz = quizzes.find(q => q.id === quizId);
                const modalTitle = document.getElementById('quiz-editor-modal-title');
                if (modalTitle) modalTitle.textContent = "تعديل الاختبار";
                
                document.getElementById('editor-quiz-id').value = quiz.id;
                document.getElementById('editor-quiz-title').value = quiz.title;
                document.getElementById('editor-quiz-category').value = quiz.category;
                document.getElementById('editor-quiz-desc').value = quiz.description || "";

                if (quiz.questions) {
                    quiz.questions.forEach((q, idx) => {
                        addQuestionEditorBlock(q, idx);
                    });
                }
            } else {
                const modalTitle = document.getElementById('quiz-editor-modal-title');
                if (modalTitle) modalTitle.textContent = "إنشاء اختبار جديد";
                
                document.getElementById('editor-quiz-id').value = "";
                document.getElementById('editor-quiz-title').value = "";
                document.getElementById('editor-quiz-category').value = "النحو";
                document.getElementById('editor-quiz-desc').value = "";
                addQuestionEditorBlock();
            }
            if (modal) modal.classList.remove('hidden');
        }

        function addQuestionEditorBlock(questionData = null, index = null) {
            const container = document.getElementById('editor-questions-container');
            if (!container) return;
            const blockIndex = index !== null ? index : container.children.length;

            const qText = questionData ? questionData.questionText : "";
            const qHint = questionData ? questionData.aiHint : "";
            const qExp = questionData ? questionData.explanation : "";
            const options = questionData ? questionData.options : [
                { text: "", isCorrect: true },
                { text: "", isCorrect: false },
                { text: "", isCorrect: false },
                { text: "", isCorrect: false }
            ];

            const blockDiv = document.createElement('div');
            blockDiv.className = "question-block bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3 relative";
            blockDiv.innerHTML = `
                <div class="flex justify-between items-center border-b pb-2">
                    <span class="font-bold text-xs text-brand-navy">السؤال رقم (${blockIndex + 1})</span>
                    <button type="button" onclick="this.closest('.question-block').remove()" class="text-xs text-red-600 hover:text-red-800"><i class="fa-solid fa-trash"></i> حذف السؤال</button>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 mb-1">نص السؤال</label>
                    <input type="text" class="q-text-input w-full px-3 py-1.5 border rounded text-xs outline-none" placeholder="اكتب نص السؤال..." value="${qText}" required>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 mb-1">تلميح الذكاء الاصطناعي (AI Hint)</label>
                        <input type="text" class="q-hint-input w-full px-3 py-1.5 border rounded text-xs outline-none" placeholder="تلميح للقاعدة..." value="${qHint || ""}">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 mb-1">شرح الإجابة الصحيحة / الإعراب</label>
                        <input type="text" class="q-exp-input w-full px-3 py-1.5 border rounded text-xs outline-none" placeholder="شرح تفصيلي للإجابة..." value="${qExp || ""}">
                    </div>
                </div>
                <div class="space-y-2 pt-1">
                    <label class="block text-[11px] font-bold text-slate-700">خيارات الإجابة (حدد الخيار الصحيح)</label>
                    <div class="space-y-1.5 options-group">
                        ${options.map((opt, oIdx) => `
                            <div class="flex items-center gap-2">
                                <input type="radio" name="correct-q-${blockIndex}" ${opt.isCorrect ? 'checked' : ''} class="correct-radio cursor-pointer">
                                <input type="text" class="opt-text-input w-full px-3 py-1 border rounded text-xs outline-none" placeholder="الخيار ${oIdx + 1}" value="${opt.text}" required>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            container.appendChild(blockDiv);
        }

        function saveQuizFromEditor() {
            const quizId = document.getElementById('editor-quiz-id').value;
            const title = document.getElementById('editor-quiz-title').value.trim();
            const category = document.getElementById('editor-quiz-category').value;
            const description = document.getElementById('editor-quiz-desc').value.trim();

            if (!title) {
                alert("يرجى إدخال عنوان الاختبار.");
                return;
            }

            const questionBlocks = document.querySelectorAll('.question-block');
            if (questionBlocks.length === 0) {
                alert("يرجى إضافة سؤال واحد على الأقل.");
                return;
            }

            const questions = [];
            for (let i = 0; i < questionBlocks.length; i++) {
                const block = questionBlocks[i];
                const qText = block.querySelector('.q-text-input').value.trim();
                const qHint = block.querySelector('.q-hint-input').value.trim();
                const qExp = block.querySelector('.q-exp-input').value.trim();

                if (!qText) {
                    alert(`السؤال رقم (${i+1}) فارغ، يجيب كتابة نصه.`);
                    return;
                }

                const optRows = block.querySelectorAll('.options-group > div');
                const options = [];
                let hasCorrect = false;

                optRows.forEach(row => {
                    const text = row.querySelector('.opt-text-input').value.trim();
                    const isCorrect = row.querySelector('.correct-radio').checked;
                    if (isCorrect) hasCorrect = true;
                    if (text) {
                        options.push({ text, isCorrect });
                    }
                });

                if (options.length < 2) {
                    alert(`السؤال رقم (${i+1}) يجب أن يحتوي على خيارين على الأقل.`);
                    return;
                }
                if (!hasCorrect) {
                    alert(`السؤال رقم (${i+1}) يجب تحديد إجابة صحيحة واحدة على الأقل.`);
                    return;
                }

                questions.push({
                    id: 'q-' + Math.random().toString(36).substring(2, 7),
                    questionText: qText,
                    aiHint: qHint,
                    explanation: qExp,
                    options: options
                });
            }

            const quizObject = {
                id: quizId || ('quiz-' + Date.now()),
                title: title,
                category: category,
                description: description,
                createdBy: teacherSession ? teacherSession.name : "أستاذ المادة",
                createdAt: new Date().toISOString().split('T')[0],
                questions: questions
            };

            if (quizId) {
                const index = quizzes.findIndex(q => q.id === quizId);
                if (index !== -1) quizzes[index] = quizObject;
            } else {
                quizzes.unshift(quizObject);
            }

            saveAppData();
            closeModal('modal-quiz-editor');
            renderTeacherDashboard();
            renderPublicQuizzes();
            showToast("تم حفظ الاختبار وتوليد الرابط بنجاح", "success");
        }

        function deleteQuiz(quizId) {
            if (confirm("هل أنت متأكد من حذف هذا الاختبار نهائياً؟")) {
                quizzes = quizzes.filter(q => q.id !== quizId);
                saveAppData();
                renderTeacherDashboard();
                renderPublicQuizzes();
                showToast("تم حذف الاختبار بنجاح", "info");
            }
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.classList.add('hidden');
        }

        function copyToClipboard(text) {
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                showToast("تم نسخ الرابط إلى الحافظة بنجاح", "success");
            }).catch(() => {
                const tempInput = document.createElement('input');
                tempInput.value = text;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                showToast("تم نسخ الرابط بنجاح", "success");
            });
        }

        function showToast(message, type = "info") {
            const toast = document.getElementById('toast');
            const msgSpan = document.getElementById('toast-message');
            const icon = document.getElementById('toast-icon');

            if (!toast || !msgSpan || !icon) return;

            msgSpan.textContent = message;
            if (type === "success") {
                icon.className = "fa-solid fa-circle-check text-emerald-400";
            } else if (type === "error") {
                icon.className = "fa-solid fa-circle-xmark text-red-400";
            } else {
                icon.className = "fa-solid fa-circle-info text-amber-400";
            }

            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3500);
        }
    </script>
